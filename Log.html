<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-Bike | Login / Signup</title>
  <link rel="stylesheet" href="Log.css" />
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="logo">Guzo_Abay</div>
    <nav>
      <ul class="nav-links">
        <li><a href="home.html" >Home</a></li>
        <li><a href="Map.html">Map</a></li>
        <li><a href="Log.html" class="active">Login</a></li>
        <li><a href="Supplier.html">Supply</a></li>
        <li><a href="Help.html">Help</a></li>
      </ul>
    </nav>
  </header>

  <!-- Auth Container -->
  <section class="auth-container">
    <div class="tabs">
      <button class="tab-btn active" id="loginTab">Login</button>
      <button class="tab-btn" id="signupTab">Sign Up</button>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="form active">
      <h2>Login to Your Account</h2>
      <label>Email</label>
      <input type="email" placeholder="Enter your email" required />

      <label>Password</label>
      <input type="password" placeholder="Enter password" required />

      <button type="submit">Login</button>
      <p class="note">Don’t have an account? <span id="toSignup" style="cursor:pointer;color:#007bff;">Sign up</span></p>
    </form>

    <!-- Signup Form -->
    <form id="signupForm" class="form">
      <h2>Create an Account</h2>
      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required />

      <label>Email</label>
      <input type="email" placeholder="Enter your email" required />

      <label>National ID</label>
      <input type="text" placeholder="Enter your National ID" required />

      <label>Password</label>
      <input type="password" placeholder="Create a password" required />

      <button type="submit">Sign Up</button>
      <p class="note">Already have an account? <span id="toLogin" style="cursor:pointer;color:#007bff;">Login</span></p>
    </form>
  </section>

  <footer>
    <p>© 2025 E-Bike Ethiopia. All rights reserved.</p>
  </footer>

  <!-- INTERACTIVE JS ADDED HERE -->
  <script>
    const loginTab = document.getElementById("loginTab");
    const signupTab = document.getElementById("signupTab");
    const loginForm = document.getElementById("loginForm");
    const signupForm = document.getElementById("signupForm");
    const toSignup = document.getElementById("toSignup");
    const toLogin = document.getElementById("toLogin");

    // Switch to Signup Form
    signupTab.addEventListener("click", () => {
      signupTab.classList.add("active");
      loginTab.classList.remove("active");
      signupForm.classList.add("active");
      loginForm.classList.remove("active");
    });

    // Switch to Login Form
    loginTab.addEventListener("click", () => {
      loginTab.classList.add("active");
      signupTab.classList.remove("active");
      loginForm.classList.add("active");
      signupForm.classList.remove("active");
    });

    // Click links inside text
    toSignup.addEventListener("click", () => signupTab.click());
    toLogin.addEventListener("click", () => loginTab.click());
  </script>

</body>
</html>
